# Nightly CHIRP refresh. This file lives in the PRIVATE data repo (its source of truth is
# deploy/data-repo/ in the public code repo; see docs/cloud.md there). Running here keeps
# the logs private: they contain data excerpts, and a public repo's Actions logs are public.
#
# Each run checks out the public code, uses this repo as its data/ folder, refreshes the men's
# (this repo's root) and then the women's (women/) against a throwaway Postgres, and commits
# each league's results here on its own terms, so one league's failure never blocks the other. The Streamlit app picks them up within
# about 10 minutes. Same rules as the Mac's scheduler (src/pipeline/scheduler.py): after
# 5 a.m. Eastern, Mondays only May-August, and up to 3 tries a day an hour or more apart.
name: Nightly refresh

on:
  schedule:  # GitHub's schedule is UTC and often runs a few minutes late
    - cron: "30 10 * * *"   # 5:30 a.m. EST / 6:30 a.m. EDT
    - cron: "30 13 * * *"   # a retry, only if the first one failed
    - cron: "30 16 * * *"   # a last retry
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's refresh already succeeded"
        type: boolean
        default: false

permissions:
  contents: write  # commit the refreshed data to this repo

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      saved: ${{ steps.save.outputs.saved }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey -d hockey"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey
      TZ: America/New_York
    steps:
      - name: Get the code (public repo)
        uses: actions/checkout@v4
        with:
          repository: TrentRice/College-Hockey-Intel-Reporting-Platform
          path: code

      - name: Get the data (this repo)
        uses: actions/checkout@v4
        with:
          path: data

      - name: Use this repo as the code's data/ folder
        run: rm -rf code/data && ln -s "$GITHUB_WORKSPACE/data" code/data

      # The scraper reuses a saved schedule page younger than 6 hours, judged by the file's
      # modified time. Git doesn't keep those times, so after a checkout every page looks
      # seconds old and nothing would be re-downloaded. Mark them old; pages of finished
      # seasons are still reused (the scraper checks that separately).
      - name: Mark saved schedule pages as old
        run: find data -path '*/raw/chn/schedules/*.html' -exec touch -d '2000-01-01' {} +

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: code/uv.lock

      - name: Install the pipeline's dependencies
        working-directory: code
        run: uv sync --locked --no-default-groups --group pipeline

      - name: Refresh men's
        id: men
        continue-on-error: true
        working-directory: code
        run: uv run --no-sync python -m src.cloud.nightly ${{ inputs.force && '--force' || '' }}

      - name: Refresh women's
        id: women
        continue-on-error: true
        working-directory: code
        env:
          CHIRP_LEAGUE: women
        run: uv run --no-sync python -m src.cloud.nightly ${{ inputs.force && '--force' || '' }}

      # Each league on its own terms: after a successful run, everything of that league;
      # otherwise only its run history and logs, so data that failed validation never reaches
      # the app. Men's files are this repo's root (except women/), women's are women/.
      - name: Save to this repo
        id: save
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.men.outcome }}" = "success" ]; then
            git add -A -- . ':!women'
          else
            git add -- pipeline_runs.csv || true
            git add -- logs || true
          fi
          if [ "${{ steps.women.outcome }}" = "success" ]; then
            git add -A -- women
          else
            git add -- women/pipeline_runs.csv || true
            git add -- women/logs || true
          fi
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "Nightly refresh $(date +%F) (men's ${{ steps.men.outcome }}, women's ${{ steps.women.outcome }})"
          git push -q
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Mark the run failed if a refresh failed
        if: steps.men.outcome != 'success' || steps.women.outcome != 'success'
        run: |
          echo "Men's: ${{ steps.men.outcome }}. Women's: ${{ steps.women.outcome }}."
          echo "See that Refresh step above, and logs/refresh/ (men's) or women/logs/refresh/ in this repo."
          exit 1

  # 5 minutes after new data is saved, visit the site: it picks the data up right away and
  # counts as a visitor, so the free app doesn't fall asleep (keep-awake.yml does the rest)
  wake:
    needs: refresh
    if: always() && needs.refresh.outputs.saved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the app to see the new data
        run: sleep 300

      - uses: actions/checkout@v4
        with:
          repository: TrentRice/College-Hockey-Intel-Reporting-Platform

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install a browser
        run: uv run --no-project --with playwright python -m playwright install --with-deps chromium

      - name: Visit the site
        run: uv run --no-project --with playwright python deploy/keep_awake.py
