[project]
name = "chirp-hockey"
version = "0.1.0"
description = "CHIRP: College Hockey Intelligence & Reporting Platform (BU opponent scouting)"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "lxml>=6.1.1",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]
