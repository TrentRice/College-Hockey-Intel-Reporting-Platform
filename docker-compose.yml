# Local stack: Postgres, the CHIRP API, the nightly refresh and the scouting dashboard.
# Start with `make up` (or `make db-up` for the database alone). Each service has its own
# image, built from one Dockerfile (targets api, pipeline, dashboard).
#
# PRIVATE BY DESIGN. College Hockey News allows personal use only, so every published port
# is bound to 127.0.0.1: reachable from this machine, refused from any network. Never change
# a port to the "8000:8000" form (that listens on every network, and Docker bypasses the Mac
# firewall), and never use network_mode: host.
services:
  db:
    image: postgres:17
    container_name: chirp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hockey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hockey}
      POSTGRES_DB: ${POSTGRES_DB:-hockey}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # this machine only (for VS Code, the loader)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped   # comes back with Docker Desktop, before the API and pipeline need it

  api:
    build: { context: ., target: api }
    image: chirp-api:local
    container_name: chirp-api
    env_file:
      - path: .env          # API_KEY comes from here at startup; it is never in the image
        required: false
    environment:
      # inside Docker's private network the database is "db", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-hockey}:${POSTGRES_PASSWORD:-hockey}@db:5432/${POSTGRES_DB:-hockey}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"        # this machine only
    depends_on:
      db:
        condition: service_healthy
    # hardening: read-only filesystem, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Nightly data refresh (src/pipeline/scheduler.py). No ports: it only reaches out to CHN
  # and to the database. The data stays on this Mac through the bind-mounted folders.
  pipeline:
    build: { context: ., target: pipeline }
    image: chirp-pipeline:local
    container_name: chirp-pipeline
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/New_York  # log timestamps in Eastern
      DATABASE_URL: postgresql://${POSTGRES_USER:-hockey}:${POSTGRES_PASSWORD:-hockey}@db:5432/${POSTGRES_DB:-hockey}
    volumes:
      - ./data:/app/data    # CSVs, raw HTML and the id registry, shared with this Mac
      - ./logs:/app/logs    # one log (and validation report) per run
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Scouting dashboard (Streamlit). Reads only from the API, never the database.
  dashboard:
    build: { context: ., target: dashboard }
    image: chirp-dashboard:local
    container_name: chirp-dashboard
    env_file:
      - path: .env          # API_KEY, to call the API
        required: false
    environment:
      CHIRP_API_URL: http://api:8000
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0   # inside the container only; see the port below
      HOME: /tmp                         # Streamlit writes small files under $HOME
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"   # no usage data to Streamlit (also in .streamlit/config.toml)
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"   # this machine only
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
