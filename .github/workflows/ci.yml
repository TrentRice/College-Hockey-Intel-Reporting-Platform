name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Postgres for the API tests, which load made-up rows (tests/api/fixture.sql), never CHN data
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hockey
          POSTGRES_PASSWORD: hockey
          POSTGRES_DB: hockey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hockey -d hockey_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://hockey:hockey@localhost:5432/hockey_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest -q
