# Streamlit settings for the CHIRP dashboard.
# No server.address here: Streamlit Community Cloud must listen on its own network (docs/cloud.md).
# Locally, `make dashboard` passes --server.address 127.0.0.1 (this machine only), and the
# Docker service publishes its port on 127.0.0.1.
[server]
port = 8501
headless = true

[browser]
gatherUsageStats = false   # no usage data sent to Streamlit

[client]
toolbarMode = "minimal"
