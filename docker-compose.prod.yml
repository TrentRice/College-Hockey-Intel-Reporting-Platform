# Public server overlay (Oracle Cloud, docs/deploy.md). Adds Caddy, the only public piece:
# it serves the dashboard over HTTPS at $DOMAIN and gets the certificate itself.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#   (or: make prod-up)
#
# Everything else keeps its 127.0.0.1 port from docker-compose.yml: the API and Postgres are
# never public. Caddy reaches the dashboard over Docker's internal network.
services:
  caddy:
    image: caddy:2.10.2
    container_name: chirp-caddy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. chirp.duckdns.org}
    ports:
      - "80:80"       # public: Let's Encrypt checks and the redirect to HTTPS
      - "443:443"     # public: the site
      - "443:443/udp" # public: HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates; keep this volume, or Caddy asks Let's Encrypt again
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # ports 80 and 443
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # A public server gets a real database password: no "hockey" default here
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

volumes:
  caddy_data:
  caddy_config:
